name: Release

on:
  push:
    tags:
      - "TodoList*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (must start with TodoList)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $releaseTag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:REQUESTED_TAG }
          if (-not $releaseTag.StartsWith('TodoList')) {
            throw 'Release tags must start with TodoList.'
          }
          git check-ref-format "refs/tags/$releaseTag"
          if ($LASTEXITCODE -ne 0) {
            throw 'Invalid release tag.'
          }
          "tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        shell: pwsh
        run: ./build.ps1 -PythonExecutable python

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/TodoList.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
